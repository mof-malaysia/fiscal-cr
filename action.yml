name: 'FiscalCR'
description: 'AI-powered, model-agnostic code review for GitHub'
author: 'irfancoder'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  api_key:
    description: 'LLM API key (omit when using the anthropic_federation_* inputs)'
    required: false
  anthropic_federation_rule_id:
    description: 'Anthropic workload identity federation rule ID (fdrl_...); enables keyless auth via GitHub OIDC. Requires provider anthropic and id-token: write'
    required: false
  anthropic_organization_id:
    description: 'Anthropic organization ID (UUID) for workload identity federation'
    required: false
  anthropic_service_account_id:
    description: 'Anthropic service account ID (svac_...) for workload identity federation'
    required: false
  anthropic_workspace_id:
    description: 'Anthropic workspace ID (wrkspc_...); required only when the federation rule spans multiple workspaces'
    required: false
  oidc_audience:
    description: "Audience for the GitHub OIDC token used in federation (defaults to the provider's API audience)"
    required: false
  github_token:
    description: 'GitHub token for API access'
    required: false
    default: ${{ github.token }}
  provider:
    description: 'Model provider: openai-compatible, openrouter, kimi, openai, or anthropic'
    required: false
  model:
    description: 'Model to use (overrides repo config when provided)'
    required: false
  base_url:
    description: 'Provider base URL override; Anthropic defaults to api.anthropic.com/v1'
    required: false
  user_agent:
    description: 'Custom User-Agent header for endpoints that whitelist clients'
    required: false
  model_params:
    description: 'Provider-native request fields as a JSON object, merged into every model call'
    required: false
  language:
    description: 'Review comment language (overrides repo config when provided)'
    required: false
  fail_on:
    description: 'Fail the check on: critical, warning, never (overrides repo config when provided)'
    required: false
  config_path:
    description: 'Path to config file (relative to repo root)'
    required: false
    default: '.fiscalcr-review.yml'
  telemetry:
    description: 'Emit metrics-only token telemetry to Action logs'
    required: false
    default: 'false'
  experimental:
    description: 'Enable experimental prompt optimizations (overrides repo config when provided)'
    required: false
  visualize:
    description: 'Enable review visualization (overrides review.visualize.enabled when provided)'
    required: false
  comments:
    description: 'Comment mode: sticky or legacy (overrides review.comments.mode when provided)'
    required: false

outputs:
  review_summary:
    description: 'The review summary text'
  annotations_count:
    description: 'Number of annotations created'
  critical_count:
    description: 'Number of critical issues found'
  tokens_used:
    description: 'Total tokens used'
  cost_estimate:
    description: 'Estimated API cost in USD'

runs:
  using: 'node24'
  main: 'action/dist/index.js'
