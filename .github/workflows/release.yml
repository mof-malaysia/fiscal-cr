name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build Action
        run: pnpm exec ncc build action/index.ts -o action/dist

      - name: Commit build and move tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # action/dist/ is gitignored, so force-add the freshly built bundle.
          git add -f action/dist/
          git commit -m "build: release $TAG"
          # Move the exact release tag onto the build commit (never touches main).
          git tag -f "$TAG"
          git push -f origin "$TAG"
          # Move the floating major tag (e.g. v1) onto the same build commit.
          MAJOR=$(echo "$TAG" | grep -oE '^v[0-9]+')
          if [ -n "$MAJOR" ]; then
            git tag -f "$MAJOR"
            git push -f origin "$MAJOR"
          fi
